# =====================================================================
#  resilience(update) —— 跨领域 Resilience 表征相似性实验
#  模型/参数参考: Thought Branches / Thought Anchors / RRB / Med-Stress
# =====================================================================

model:
  backend: transformers
  name: models/DeepSeek-R1-Distill-Qwen-14B
  dtype: float16
  device: cuda:0
  max_model_len: 8192
  attn_implementation: sdpa
  quantize: null
  prompt_mode: raw

# ---------- 采样参数 ----------
sampling:
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 256
  max_new_tokens_cont: 20
  n_base_cots: 1
  n_continuations: 1
  n_rollouts_per_sentence: 30

# ---------- Resilience 算法 ----------
resilience:
  max_iterations: 4
  similarity_threshold: 0.55
  tau_mode: fixed
  embedding_model: models/all-MiniLM-L6-v2
  embedding_device: cpu

# ---------- 实验范围 ----------
experiment:
  data_source: data/gsm8k/train.jsonl
  sample_size: 6
  sample_seed: 42
  target_min: 2
  target_max: 4
  max_instances: 15
  n_base_cots: 1
  misleading_level: 3          # 误导强度(不再依赖答案正确性)

# ---------- 机制实验 ----------
mechanism:
  patch_max_tokens: 256
  corrupt_sentence: "This step is not important and can be skipped."
  top_heads_k: 10
  cka_layers: [12, 24, 36]
  similarity_significance: 0.5

# ---------- 输出 ----------
output:
  dir: output
  figures_dir: output/figures
  report_dir: output/report
  cache_dir: output/cache
  results_file: output/results.jsonl
  summary_file: output/summary.json
  seed: 42

report:
  language: bilingual
  title: "跨领域 Resilience 的 Transformer 内部表征相似性分析"
  author: "wanghaotian group"
